<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GStorms Resource Pack Field Browser</title>

    <style>
      :root {
        --bg: #0b1724;
        --panel: #101f30;
        --panel-2: #142a40;
        --panel-3: #08131f;
        --line: #274a64;
        --text: #edf6ff;
        --muted: #a9bfd1;
        --blue: #2197f3;
        --blue-soft: #65c7ff;
        --code: #07131f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text);
        background: linear-gradient(135deg, #081522, #102840 55%, #163955);
        font:
          14px/1.5 system-ui,
          "Segoe UI",
          "Roboto",
          "Arial",
          "sans-serif";
      }

      .app {
        display: grid;
        grid-template-columns: 275px minmax(0, 1fr);
        min-height: 100vh;
      }

      .side {
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 18px;
        overflow: auto;
        background: rgba(8, 19, 31, 0.94);
        border-right: 1px solid var(--line);
      }

      .brand {
        margin-bottom: 16px;
      }

      .brand h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.18em;
      }

      .brand small {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        letter-spacing: 0.08em;
      }

      .search {
        width: 100%;
        margin: 8px 0 14px;
        padding: 10px 12px;
        color: var(--text);
        background: #0b1927;
        border: 1px solid var(--line);
        outline: none;
      }

      .search:focus {
        border-color: var(--blue);
      }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .nav button {
        padding: 9px 10px;
        text-align: left;
        color: var(--muted);
        background: transparent;
        border: 1px solid transparent;
        cursor: pointer;
      }

      .nav button:hover,
      .nav button.active {
        color: white;
        background: rgba(33, 151, 243, 0.12);
        border-color: #245579;
      }

      .main {
        width: min(100%, 1040px);
        padding: 28px;
      }

      .hero {
        padding: 20px 0 22px;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }

      .hero h2 {
        margin: 0 0 6px;
        font-size: 34px;
        letter-spacing: 0.04em;
      }

      .hero p {
        max-width: 820px;
        margin: 0;
        color: var(--muted);
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .tag {
        padding: 4px 8px;
        color: #d9edf8;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line);
      }

      .grid {
        display: grid;
        gap: 12px;
      }

      details {
        background: rgba(19, 39, 58, 0.92);
        border: 1px solid var(--line);
      }

      summary {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto 18px;
        align-items: center;
        gap: 12px;
        padding: 13px 15px;
        list-style: none;
        cursor: pointer;
      }

      summary::-webkit-details-marker {
        display: none;
      }

      summary::after {
        grid-column: 3;
        justify-self: end;
        content: "+";
        color: var(--blue-soft);
        font-weight: 700;
      }

      details[open] > summary::after {
        content: "–";
      }

      .group > summary,
      .profile-result > summary {
        background: rgba(255, 255, 255, 0.025);
      }

      .profile-result {
        background: rgba(10, 25, 39, 0.8);
      }

      .field {
        margin: 10px 0;
        background: rgba(7, 19, 31, 0.42);
      }

      .field summary {
        padding: 10px 12px;
      }

      .field .field {
        margin-left: 12px;
        background: rgba(255, 255, 255, 0.025);
      }

      .name {
        grid-column: 1;
        min-width: 0;
        padding-right: 10px;
        overflow-wrap: anywhere;
        color: white;
        font-weight: 700;
      }

      .type {
        grid-column: 2;
        justify-self: end;
        white-space: nowrap;
        color: var(--blue-soft);
        font-size: 12px;
      }

      .body {
        padding: 0 15px 14px;
      }

      .desc {
        margin: 0 0 8px;
        color: var(--muted);
      }

      .alias {
        margin: 0 0 10px;
        color: #cfe7f7;
        font-size: 12px;
      }

      .alias code {
        padding: 1px 5px;
        color: white;
        background: #0a1724;
      }

      .children {
        margin-top: 12px;
      }

      .example {
        margin: 12px 0 0;
        padding: 12px;
        overflow: auto;
        color: #d7ecff;
        background: var(--code);
        border-left: 3px solid var(--blue);
      }

      .empty {
        padding: 24px;
        color: var(--muted);
        border: 1px dashed var(--line);
      }

      code,
      pre {
        font-family: Consolas, Menlo, monospace;
      }

      @media (max-width: 820px) {
        .app {
          grid-template-columns: 1fr;
        }

        .side {
          position: relative;
          height: auto;
        }

        .main {
          padding: 18px;
        }

        .hero h2 {
          font-size: 26px;
        }
      }

      details > .body {
        animation: dropdown-open 0.15s ease-out;
        transform-origin: top;
      }

      @keyframes dropdown-open {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        details > .body {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <aside class="side">
        <div class="brand">
          <h1>GSTORMS</h1>
          <small>field browser</small>
        </div>

        <input
          id="search"
          class="search"
          placeholder="Search fields, aliases, profiles..."
        />
        <div id="nav" class="nav"></div>
      </aside>

      <main class="main">
        <section class="hero">
          <h2 id="title"></h2>
          <p id="intro"></p>
          <div id="tags" class="tags"></div>
        </section>

        <section id="content" class="grid"></section>
      </main>
    </div>

    <script>
      const PROFILE_TYPES = [
        "condensation",
        "subvortexcondensation",
        "mesocyclone",
        "hurricane",
        "dustdevil",
        "landspoutlayer",
        "debris",
        "curtains",
        "stormcloud",
        "rainsheet",
        "rain",
        "snow",
        "cloud",
        "sandstorm",
        "pyroclasticflow",
      ];

      const SUPPORTS = {
        all: "all",
        orbit: [
          "condensation",
          "subvortexcondensation",
          "dustdevil",
          "landspoutlayer",
        ],
        orbitBlend: ["condensation", "dustdevil", "landspoutlayer"],
        alphaWindspeed: [
          "condensation",
          "subvortexcondensation",
          "mesocyclone",
          "hurricane",
          "dustdevil",
          "landspoutlayer",
          "curtains",
          "debris",
        ],
        physics: ["debris", "curtains"],
        reflect: ["stormcloud", "rainsheet", "rain", "snow"],
        reflectAll: ["stormcloud", "rainsheet", "rain", "snow", "cloud"],
        rain: ["rain", "snow"],
        flow: ["sandstorm", "pyroclasticflow"],
        condensation: ["condensation"],
        cloud: ["cloud"],
        debris: ["debris"],
      };

      const PROFILE_INTROS = {
        pack: "Top-level resource-pack settings, including the pack name, lighting controls, sky colors, sun colors, and fog setup.",
        condensation: "The condensation / funnel profile for tornadoes.",
        subvortexcondensation: "The condensation profile for subvortices.",
        mesocyclone:
          "The rotating storm-base cloud profile used above tornadoes.",
        hurricane:
          "The profile that hurricanes use for their rotating cloud structure.",
        dustdevil: "The inner dust tube profile for dust devils.",
        landspoutlayer: "The inner dust tube profile that landspouts use.",
        debris: "The debris profile for vortices.",
        curtains:
          "The profile for debris curtains that wrap around violent tornadoes.",
        stormcloud:
          "The storm cloud material used by weather entities like thunderstorms, rainstorms, tornadoes etc,.",
        rainsheet:
          "The distant precipitation sheet profile that fills storms with broad rain or snow curtains.",
        rain: "The close-range rain particle profile that spawns around the player.",
        snow: "The close-range snow particle profile that spawns around the player.",
        cloud:
          "The ambient cloud profile for large drifting background cloud groups.",
        sandstorm: "The flow particle profile for sandstorms.",
        pyroclasticflow: "The flow particle profile for pyroclastic flows.",
      };

      const GROUPS = [
        {
          id: "pack",
          name: "pack",
          profiles: ["pack"],
          desc: "Basic resource-pack setup. Use this section to name the pack and define optional lighting and environment behavior.",
          ex: d(`
            pack_name = "My Storm Pack"

            lighting_and_environment = {
              legacy_lighting = false
            }
          `),
          fields: [
            field(
              "pack_name",
              "string",
              "The display name for this resource pack in menus and pack selection.",
              ["packName"],
              d(`
                pack_name = "GStorms: Default Resource Pack"
              `),
            ),

            field(
              "lighting_and_environment",
              "table",
              "Optional world-lighting settings for this pack. This can change sky colors, sun colors, fog, particle lighting, and nighttime screen effects.",
              [],
              d(`
                lighting_and_environment = {
                  legacy_lighting = false,

                  controls = {
                    exposure_strength = 5.5,
                    night_darkness = 0.55
                  },

                  day = {
                    sky_colors = {
                      default = {top = Color(70, 146, 232), bottom = Color(206, 223, 227)},
                      rain = {top = Color(174, 180, 175), bottom = Color(124, 130, 134)}
                    },

                    sun_colors = {
                      default = Color(255, 248, 235),
                      rain = Color(246, 255, 232)
                    },

                    fog = {
                      default = {density = 0.75, fog_start = 1, fog_end = 45000},
                      rain = {density = 0.75, fog_start = 1, fog_end = 45000},
                      rain_clientside = {density = 0.85, fog_start = -1, fog_end = 7500}
                    }
                  }
                }
              `),
              ["pack"],
              [
                field(
                  "legacy_lighting",
                  "boolean",
                  "Turns the older lighting behavior on or off. For particle lighting_and_environment controls, this needs to be set to false to use the new lighting engine and should only be used for legacy / older packs.",
                  [],
                  d(`
                    legacy_lighting = false
                  `),
                ),

                field(
                  "controls",
                  "table",
                  "Global lighting tuning values. These control particle brightness, tinting, rain washout, and nighttime darkness.",
                  [],
                  d(`
                    controls = {
                      exposure_strength = 5.5,
                      exposure_exponent = 0.35,
                      contrast_strength = 0.1,
                      tint_strength = 1.5,
                      tint_control = 0.7,
                      volumetric_strength = 0.1,
                      night_darkness = 0.55,
                      night_desaturate = 0.375
                    }
                  `),
                  ["pack"],
                  [
                    field(
                      "exposure_strength",
                      "number",
                      "Controls how strongly particles follow the scene brightness. Higher values make dim lighting darker, and lower values keep particles brighter during sunrise, sunset, nighttime, or heavy overcast.",
                      [],
                      d(`exposure_strength = 5.5`),
                    ),
                    field(
                      "exposure_exponent",
                      "number",
                      "Controls the brightness curve. Lower values preserve more brightness through mid-light conditions, and higher values make the shift into darkness feel stronger.",
                      [],
                      d(`exposure_exponent = 0.35`),
                    ),
                    field(
                      "contrast_strength",
                      "number",
                      "Controls how much separation exists between the bright and dark sides of shaded particles. Higher values look more dramatic, and lower values look softer and flatter.",
                      [],
                      d(`contrast_strength = 0.1`),
                    ),
                    field(
                      "tint_strength",
                      "number",
                      "Controls how strongly sky and sun colors tint particles. Higher values make particles inherit more environmental color, and lower values keep their original colors more neutral.",
                      [],
                      d(`tint_strength = 1.5`),
                    ),
                    field(
                      "tint_control",
                      "number",
                      "Controls how much saturated particle colors resist environmental tinting. Higher values protect strong base colors, and lower values let the environment recolor them more easily.",
                      [],
                      d(`tint_control = 0.7`),
                    ),
                    field(
                      "volumetric_strength",
                      "number",
                      "Controls how washed out particles become in wet, foggy, or scattered lighting. Higher values make particles in rain and overcast scenes feel more diffused and softer.",
                      [],
                      d(`volumetric_strength = 0.1`),
                    ),
                    field(
                      "night_darkness",
                      "number",
                      "Controls how much the screen darkens at night. Higher values make nights darker, and lower values keep nighttime visibility higher.",
                      [],
                      d(`night_darkness = 0.55`),
                    ),
                    field(
                      "night_desaturate",
                      "number",
                      "Controls how much color is removed at night. Higher values make nighttime look more gray, and lower values keep night colors richer.",
                      [],
                      d(`night_desaturate = 0.375`),
                    ),
                  ],
                ),

                field(
                  "sunrise / day / sunset / night",
                  "table",
                  "Time-of-day phase blocks. Each phase can define sky colors, sun colors, and fog so the environment can smoothly change through the day.",
                  [],
                  d(`
                    day = {
                      sky_colors = {
                        default = {top = Color(70, 146, 232), bottom = Color(206, 223, 227)},
                        rain = {top = Color(174, 180, 175), bottom = Color(124, 130, 134)}
                      },

                      sun_colors = {
                        default = Color(255, 248, 235),
                        rain = Color(246, 255, 232)
                      },

                      fog = {
                        default = {density = 0.75, fog_start = 1, fog_end = 45000}
                      }
                    }
                  `),
                  ["pack"],
                  [
                    field(
                      "sky_colors",
                      "table",
                      "Sky paint colors for normal weather and rainy or stormy weather.",
                      [],
                      d(`
                        sky_colors = {
                          default = {top = Color(70, 146, 232), bottom = Color(206, 223, 227)},
                          rain = {top = Color(174, 180, 175), bottom = Color(124, 130, 134)}
                        }
                      `),
                      ["pack"],
                      [
                        field(
                          "default",
                          "table",
                          "The normal sky colors for this time-of-day phase.",
                          [],
                          d(
                            `default = {top = Color(70, 146, 232), bottom = Color(206, 223, 227)}`,
                          ),
                          ["pack"],
                          [
                            field(
                              "top",
                              "Color",
                              "The upper sky color.",
                              [],
                              d(`top = Color(70, 146, 232)`),
                            ),
                            field(
                              "bottom",
                              "Color",
                              "The lower horizon sky color.",
                              [],
                              d(`bottom = Color(206, 223, 227)`),
                            ),
                          ],
                        ),
                        field(
                          "rain",
                          "table",
                          "The sky colors blended in during rainy or stormy weather.",
                          [],
                          d(
                            `rain = {top = Color(174, 180, 175), bottom = Color(124, 130, 134)}`,
                          ),
                          ["pack"],
                          [
                            field(
                              "top",
                              "Color",
                              "The upper sky color during rain or storm conditions.",
                              [],
                              d(`top = Color(174, 180, 175)`),
                            ),
                            field(
                              "bottom",
                              "Color",
                              "The lower horizon sky color during rain or storm conditions.",
                              [],
                              d(`bottom = Color(124, 130, 134)`),
                            ),
                          ],
                        ),
                      ],
                    ),

                    field(
                      "sun_colors",
                      "table",
                      "Sunlight colors for normal weather and rainy or stormy weather. These help tint particle lighting and sky lighting.",
                      [],
                      d(`
                        sun_colors = {
                          default = Color(255, 248, 235),
                          rain = Color(246, 255, 232)
                        }
                      `),
                      ["pack"],
                      [
                        field(
                          "default",
                          "Color",
                          "The default sun color at this time-of-day and phase.",
                          [],
                          d(`default = Color(255, 248, 235)`),
                        ),
                        field(
                          "rain",
                          "Color",
                          "The sun color used during rainy or stormy conditions.",
                          [],
                          d(`rain = Color(246, 255, 232)`),
                        ),
                      ],
                    ),

                    field(
                      "fog",
                      "table",
                      "Fog settings for normal weather, rain, and close-range clientside storm fog.",
                      [],
                      d(`
                        fog = {
                          default = {density = 0.75, fog_start = 1, fog_end = 45000},
                          rain = {density = 0.75, fog_start = 1, fog_end = 45000},
                          rain_clientside = {density = 0.85, fog_start = -1, fog_end = 7500}
                        }
                      `),
                      ["pack"],
                      [
                        field(
                          "default",
                          "table",
                          "The default fog settings for this time-of-day and phase.",
                          [],
                          d(
                            `default = {density = 0.75, fog_start = 1, fog_end = 45000}`,
                          ),
                          ["pack"],
                          fogFields(),
                        ),
                        field(
                          "rain",
                          "table",
                          "The fog settings blended in during rainy or stormy weather.",
                          [],
                          d(
                            `rain = {density = 0.75, fog_start = 1, fog_end = 45000}`,
                          ),
                          ["pack"],
                          fogFields(),
                        ),
                        field(
                          "rain_clientside",
                          "table",
                          "Extra close-range fog used clientside during heavy storm conditions.",
                          [],
                          d(
                            `rain_clientside = {density = 0.85, fog_start = -1, fog_end = 7500}`,
                          ),
                          ["pack"],
                          fogFields(),
                        ),
                      ],
                    ),
                  ],
                ),
              ],
            ),
          ],
        },

        {
          id: "profile",
          name: "profile",
          profiles: SUPPORTS.all,
          desc: "Fields every particle profile entry can use, regardless of the profile type.",
          ex: d(`
            {
              key = "mesocyclone",
              material = "clouds_and_weather/wispy_smoke5",
              static_color = Color(255, 255, 255, 220),
              height = 1200
            }
          `),
          fields: [
            field(
              "key",
              "string",
              "Which profile type this entry belongs to, such as condensation, debris, rain, snow, or cloud.",
              [],
              d(`key = "condensation"`),
            ),
            field(
              "material",
              "string",
              "The material path used by this particle.",
              [],
              d(`material = "clouds_and_weather/wispy_smoke4"`),
            ),
            field(
              "material_flags",
              "string",
              "Optional Source material flags passed into Material(), such as smooth filtering.",
              ["materialFlags"],
              d(`material_flags = "smooth"`),
            ),
            field(
              "static_color",
              "color/range",
              "Makes the profile use a flat static color. When this is set, it is used instead of shaded_color.",
              ["color"],
              d(`static_color = Color(255, 255, 255, 210)`),
            ),
            field(
              "shaded_color",
              "table",
              "A bright and dark color pair used for 3D shading for sunlighting (bright) and backlighting (dark).",
              ["dynamic_color", "angle_colors", "angleColors"],
              d(`
              shaded_color = {
                bright = Color(255, 255, 255),
                dark = Color(75, 90, 110)
              }
            `),
            ),
            field(
              "fall_speed",
              "number",
              "How fast the particle falls downward.",
              ["fallSpeed"],
              d(`fall_speed = 350`),
            ),
            field(
              "height",
              "number",
              "Moves the particle spawn position up or down.",
              ["addHeight"],
              d(`height = 900`),
            ),
            field(
              "spawn_radius",
              "number",
              "The radius at which particles will spawn within, for rain and snow particles this is around the player, for other particles this is in the world around the entities position.",
              ["spawnRadius", "player_offset", "playerOffset"],
              d(`spawn_radius = 40000`),
              SUPPORTS.reflectAll,
            ),
            field(
              "centered",
              "boolean",
              "Centers particles around their point of orbit while still maintaining orbit related properties such as color and lifetime.",
              [],
              d(`centered = true`),
              SUPPORTS.orbit,
            ),
            field(
              "blend_top",
              "boolean",
              "Fades particles near the top of the funnel or particle system so particles that normally connect to storm clouds blend.",
              ["blendTop"],
              d(`blend_top = true`),
              SUPPORTS.orbitBlend,
            ),
            field(
              "blend_angle",
              "boolean",
              "Orbit particles have particles behind the point of orbit faded to improve blending.",
              ["useAngleAlpha"],
              d(`blend_angle = true`),
              [
                "condensation",
                "subvortexcondensation",
                "mesocyclone",
                "hurricane",
                "dustdevil",
                "landspoutlayer",
              ],
            ),
            field(
              "lifetime_override",
              "boolean",
              "Forces the profile lifetime to be used when orbit particles normally control lifetime automatically.",
              ["useLifetimeOverride"],
              d(`lifetime_override = true`),
              [
                "condensation",
                "subvortexcondensation",
                "mesocyclone",
                "hurricane",
                "dustdevil",
                "landspoutlayer",
              ],
            ),
            field(
              "flow_particle_end_size_mult",
              "number",
              "Controls how much sandstorm or pyroclastic-flow particles grow near the end of their life.",
              [],
              d(`flow_particle_end_size_mult = 3`),
              SUPPORTS.flow,
            ),
          ],
        },

        {
          id: "alpha_controls",
          name: "alpha_controls",
          profiles: SUPPORTS.all,
          aliases: ["alphaControls"],
          desc: "Controls the particle's base visibility and how it fades in or out over its lifetime.",
          ex: d(`
            alpha_controls = {
              alpha_min = 80,
              alpha_max = 140,
              fade_in = 0.05,
              fade_out = 0.85
            }
          `),
          fields: [
            field(
              "alpha_min",
              "number",
              "The lowest random opacity this particle can start with.",
              ["alphaMin"],
              d(`alpha_min = 80`),
            ),
            field(
              "alpha_max",
              "number",
              "The highest random opacity this particle can start with.",
              ["alphaMax"],
              d(`alpha_max = 140`),
            ),
            field(
              "fade_in",
              "number",
              "How much of the particle lifetime is spent fading in. Higher values make particles appear more gradually. This is how far into the particles lifetime from 0 to 1 as to how long it takes for the particle to complete fading in.",
              ["fadeIn"],
              d(`fade_in = 0.05`),
            ),
            field(
              "fade_out",
              "number",
              "How much of the particle lifetime is spent fading out. Higher values make particles disappear more gradually near the end of their life. This is how far from the particles end of life from 0 to 1 as to how long it takes for a particle to completely fade out. If the fade in is 0.05 and the fade out is 0.95 then the particle starts fading out as soon as the particle completes its fade in.",
              ["fadeOut"],
              d(`fade_out = 0.95`),
            ),
          ],
        },

        {
          id: "rotation",
          name: "rotation",
          profiles: SUPPORTS.all,
          desc: "Picks a random starting rotation for the particle between min and max.",
          ex: d(`
            rotation = {
              min = -180,
              max = 180
            }
          `),
          fields: [
            field(
              "min",
              "number",
              "The minimum angle out of 360 degrees that the material itself can start rotated at on initial spawn.",
              [],
              d(`min = -180`),
            ),
            field(
              "max",
              "number",
              "The maximum angle out of 360 degrees that the material itself can start rotated at on initial spawn.",
              [],
              d(`max = 180`),
            ),
          ],
        },

        {
          id: "particle_parameters",
          name: "particle_parameters",
          profiles: SUPPORTS.all,
          aliases: ["particleParams"],
          desc: "Controls particle size, spawn amount, lifetime, size randomness, and optional maximum size.",
          ex: d(`

      const PAGES = [
        { id: "pack", label: "pack" },
        ...PROFILE_TYPES.map((profile) => ({ id: profile, label: profile })),
      ];

      let current = "pack";

      const searchInput = document.getElementById("search");
      const nav = document.getElementById("nav");
      const title = document.getElementById("title");
      const intro = document.getElementById("intro");
      const tags = document.getElementById("tags");
      const content = document.getElementById("content");

      function d(text) {
        const lines = String(text)
          .replace(/^\n|\n\s*$/g, "")
          .split("\n");
        const indents = lines
          .filter((line) => line.trim())
          .map((line) => line.match(/^\s*/)[0].length);
        const minIndent = indents.length ? Math.min(...indents) : 0;

        return lines.map((line) => line.slice(minIndent)).join("\n");
      }

      function html(lines) {
        return lines.join("\n");
      }

      function field(name, type, desc, aliases, ex, profiles, fields) {
        return {
          name,
          type,
          desc,
          aliases: aliases || [],
          ex,
          profiles: profiles || "all",
          fields: fields || [],
        };
      }

      function fogFields() {
        return [
          field(
            "density",
            "number",
            "Fog thickness. Higher values make the view foggier, and lower values make the air clearer.",
            [],
            d(`density = 0.75`),
          ),
          field(
            "fog_start",
            "number",
            "The distance where fog starts blending into the view.",
            [],
            d(`fog_start = 1`),
          ),
          field(
            "fog_end",
            "number",
            "The distance where fog reaches full strength.",
            [],
            d(`fog_end = 45000`),
          ),
        ];
      }

      function supports(profiles, page) {
        if (page === "pack") {
          return Array.isArray(profiles) && profiles.includes(page);
        }

        if (profiles === "all") {
          return PROFILE_TYPES.includes(page);
        }

        return Array.isArray(profiles) && profiles.includes(page);
      }

      function lower(value) {
        return String(value || "").toLowerCase();
      }

      function searchable(value) {
        return lower(JSON.stringify(value));
      }

      function matches(value, query) {
        return !query || searchable(value).includes(query);
      }

      function escapeHtml(value) {
        return String(value).replace(
          /[&<>]/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
            })[char],
        );
      }

      function aliasesHtml(aliases) {
        if (!aliases || !aliases.length) {
          return "";
        }

        return html([
          `<p class="alias">Alternative aliases: ${aliases.map((alias) => `<code>${escapeHtml(alias)}</code>`).join(" ")}</p>`,
        ]);
      }

      function pageIntro(page) {
        return (
          PROFILE_INTROS[page] ||
          `Supported fields for the ${page} profile type.`
        );
      }

      function filterFields(fields, page, query, parentMatches = false) {
        return fields
          .filter((item) => supports(item.profiles, page))
          .map((item) => {
            const itemMatches = matches(item, query);
            const childFields = filterFields(
              item.fields || [],
              page,
              query,
              parentMatches || itemMatches,
            );

            if (!query || parentMatches || itemMatches || childFields.length) {
              return {
                ...item,
                fields:
                  query && !itemMatches && !parentMatches
                    ? childFields
                    : item.fields,
              };
            }

            return null;
          })
          .filter(Boolean);
      }

      function pageGroups(page, query = "") {
        return GROUPS.filter((group) => supports(group.profiles, page))
          .map((group) => {
            const groupMatch = matches(
              {
                id: group.id,
                name: group.name,
                desc: group.desc,
                aliases: group.aliases,
                ex: group.ex,
              },
              query,
            );

            const fields = filterFields(group.fields, page, query, groupMatch);

            return fields.length ? { ...group, fields } : null;
          })
          .filter(Boolean);
      }

      function pageHasMatch(page, query) {
        return (
          lower(page.label).includes(query) || pageGroups(page.id, query).length
        );
      }

      function searchResults(query) {
        return PAGES.map((page) => {
          const labelMatch = lower(page.label).includes(query);
          const groups = pageGroups(page.id, labelMatch ? "" : query);

          return groups.length ? { page, groups } : null;
        }).filter(Boolean);
      }

      function renderNav() {
        const query = lower(searchInput.value.trim());

        nav.innerHTML = "";

        PAGES.filter((page) => !query || pageHasMatch(page, query)).forEach(
          (page) => {
            const button = document.createElement("button");
            button.textContent = page.label;
            button.className = page.id === current ? "active" : "";
            button.onclick = () => {
              current = page.id;
              render();
            };
            nav.appendChild(button);
          },
        );
      }

      function renderSearch(query) {
        const results = searchResults(query);

        title.textContent = `Search: ${searchInput.value.trim()}`;
        intro.textContent =
          "Matching fields are grouped by profile type. Alias searches still lead back to the preferred field name.";
        tags.innerHTML = results
          .map(
            (result) =>
              `<span class="tag">${escapeHtml(result.page.label)}</span>`,
          )
          .join("");
        content.innerHTML = results.length
          ? results.map(searchPageHtml).join("")
          : `<div class="empty">No fields matched the search.</div>`;

        renderNav();
      }

      function render() {
        const query = lower(searchInput.value.trim());

        if (query) {
          renderSearch(query);
          return;
        }

        const groups = pageGroups(current);

        title.textContent = current;
        intro.textContent = pageIntro(current);
        tags.innerHTML = groups
          .map((group) => `<span class="tag">${escapeHtml(group.name)}</span>`)
          .join("");
        content.innerHTML = groups.length
          ? groups.map(groupHtml).join("")
          : `<div class="empty">No fields matched the search.</div>`;

        renderNav();
      }

      function searchPageHtml(result) {
        return html([
          `<details class="profile-result">`,
          `  <summary>`,
          `    <span class="name">${escapeHtml(result.page.label)}</span>`,
          `    <span class="type">${result.groups.length} groups</span>`,
          `  </summary>`,
          ``,
          `  <div class="body">`,
          `    <div class="children">`,
          `      ${result.groups.map(groupHtml).join("")}`,
          `    </div>`,
          `  </div>`,
          `</details>`,
        ]);
      }

      function groupHtml(group) {
        return html([
          `<details class="group">`,
          `  <summary>`,
          `    <span class="name">${escapeHtml(group.name)}</span>`,
          `    <span class="type">${group.fields.length} fields</span>`,
          `  </summary>`,
          ``,
          `  <div class="body">`,
          `    <p class="desc">${escapeHtml(group.desc)}</p>`,
          `    ${aliasesHtml(group.aliases)}`,
          ``,
          `    <pre class="example"><code>${escapeHtml(group.ex)}</code></pre>`,
          ``,
          `    <div class="children">`,
          `      ${group.fields.map(fieldHtml).join("")}`,
          `    </div>`,
          `  </div>`,
          `</details>`,
        ]);
      }

      function fieldHtml(item) {
        const childHtml =
          item.fields && item.fields.length
            ? `<div class="children">${item.fields.map(fieldHtml).join("")}</div>`
            : "";

        return html([
          `<details class="field">`,
          `  <summary>`,
          `    <span class="name"><code>${escapeHtml(item.name)}</code></span>`,
          `    <span class="type">${escapeHtml(item.type)}</span>`,
          `  </summary>`,
          ``,
          `  <div class="body">`,
          `    <p class="desc">${escapeHtml(item.desc)}</p>`,
          `    ${aliasesHtml(item.aliases)}`,
          ``,
          `    <pre class="example"><code>${escapeHtml(item.ex)}</code></pre>`,
          ``,
          `    ${childHtml}`,
          `  </div>`,
          `</details>`,
        ]);
      }

      searchInput.addEventListener("input", render);
      render();
    </script>
