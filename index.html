<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GStorms Resource Pack Field Browser</title>

    <style>
      :root {
        --bg: #0b1724;
        --panel: #101f30;
        --panel-2: #142a40;
        --panel-3: #08131f;
        --line: #274a64;
        --text: #edf6ff;
        --muted: #a9bfd1;
        --blue: #2197f3;
        --blue-soft: #65c7ff;
        --code: #07131f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text);
        background: linear-gradient(135deg, #081522, #102840 55%, #163955);
        font:
          14px/1.5 system-ui,
          "Segoe UI",
          "Roboto",
          "Arial",
          "sans-serif";
      }

      .app {
        display: grid;
        grid-template-columns: 275px minmax(0, 1fr);
        min-height: 100vh;
      }

      .side {
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 18px;
        overflow: auto;
        background: rgba(8, 19, 31, 0.94);
        border-right: 1px solid var(--line);
      }

      .brand {
        margin-bottom: 16px;
      }

      .brand h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.18em;
      }

      .brand small {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        letter-spacing: 0.08em;
      }

      .search {
        width: 100%;
        margin: 8px 0 14px;
        padding: 10px 12px;
        color: var(--text);
        background: #0b1927;
        border: 1px solid var(--line);
        outline: none;
      }

      .search:focus {
        border-color: var(--blue);
      }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .nav button {
        padding: 9px 10px;
        text-align: left;
        color: var(--muted);
        background: transparent;
        border: 1px solid transparent;
        cursor: pointer;
      }

      .nav button:hover,
      .nav button.active {
        color: white;
        background: rgba(33, 151, 243, 0.12);
        border-color: #245579;
      }

      .main {
        width: min(100%, 1040px);
        padding: 28px;
      }

      .hero {
        padding: 20px 0 22px;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }

      .hero h2 {
        margin: 0 0 6px;
        font-size: 34px;
        letter-spacing: 0.04em;
      }

      .hero p {
        max-width: 820px;
        margin: 0;
        color: var(--muted);
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .tag {
        padding: 4px 8px;
        color: #d9edf8;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line);
      }

      .grid {
        display: grid;
        gap: 12px;
      }

      details {
        background: rgba(19, 39, 58, 0.92);
        border: 1px solid var(--line);
      }

      summary {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto 18px;
        align-items: center;
        gap: 12px;
        padding: 13px 15px;
        list-style: none;
        cursor: pointer;
      }

      summary::-webkit-details-marker {
        display: none;
      }

      summary::after {
        grid-column: 3;
        justify-self: end;
        content: "+";
        color: var(--blue-soft);
        font-weight: 700;
      }

      details[open] > summary::after {
        content: "–";
      }

      .group > summary,
      .profile-result > summary {
        background: rgba(255, 255, 255, 0.025);
      }

      .profile-result {
        background: rgba(10, 25, 39, 0.8);
      }

      .field {
        margin: 10px 0;
        background: rgba(7, 19, 31, 0.42);
      }

      .field summary {
        padding: 10px 12px;
      }

      .field .field {
        margin-left: 12px;
        background: rgba(255, 255, 255, 0.025);
      }

      .name {
        grid-column: 1;
        min-width: 0;
        padding-right: 10px;
        overflow-wrap: anywhere;
        color: white;
        font-weight: 700;
      }

      .type {
        grid-column: 2;
        justify-self: end;
        white-space: nowrap;
        color: var(--blue-soft);
        font-size: 12px;
      }

      .body {
        padding: 0 15px 14px;
      }

      .desc {
        margin: 0 0 8px;
        color: var(--muted);
      }

      .alias {
        margin: 0 0 10px;
        color: #cfe7f7;
        font-size: 12px;
      }

      .alias code {
        padding: 1px 5px;
        color: white;
        background: #0a1724;
      }

      .children {
        margin-top: 12px;
      }

      .example {
        margin: 12px 0 0;
        padding: 12px;
        overflow: auto;
        color: #d7ecff;
        background: var(--code);
        border-left: 3px solid var(--blue);
      }

      .empty {
        padding: 24px;
        color: var(--muted);
        border: 1px dashed var(--line);
      }

      code,
      pre {
        font-family: Consolas, Menlo, monospace;
      }

      @media (max-width: 820px) {
        .app {
          grid-template-columns: 1fr;
        }

        .side {
          position: relative;
          height: auto;
        }

        .main {
          padding: 18px;
        }

        .hero h2 {
          font-size: 26px;
        }
      }

      details > .body {
        animation: dropdown-open 0.15s ease-out;
        transform-origin: top;
      }

      @keyframes dropdown-open {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        details > .body {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <aside class="side">
        <div class="brand">
          <h1>GSTORMS</h1>
          <small>field browser</small>
        </div>

        <input
          id="search"
          class="search"
          placeholder="Search fields, aliases, profiles..."
        />
        <div id="nav" class="nav"></div>
      </aside>

      <main class="main">
        <section class="hero">
          <h2 id="title"></h2>
          <p id="intro"></p>
          <div id="tags" class="tags"></div>
        </section>

        <section id="content" class="grid"></section>
      </main>
    </div>

    <script>
      function d(text) {
        const lines = String(text)
          .replace(/^\n|\n\s*$/g, "")
          .split("\n");
        const indents = lines
          .filter((line) => line.trim())
          .map((line) => line.match(/^\s*/)[0].length);
        const minIndent = indents.length ? Math.min(...indents) : 0;

        return lines.map((line) => line.slice(minIndent)).join("\n");
      }

      function html(lines) {
        return lines.join("\n");
      }

      function field(name, type, desc, aliases, ex, profiles, fields) {
        return {
          name,
          type,
          desc,
          aliases: aliases || [],
          ex,
          profiles: profiles || "all",
          fields: fields || [],
        };
      }

      function fogFields() {
        return [
          field(
            "density",
            "number",
            "Fog thickness. Higher values make the view foggier, and lower values make the air clearer.",
            [],
            d(`density = 0.75`),
          ),
          field(
            "fog_start",
            "number",
            "The distance where fog starts blending into the view.",
            [],
            d(`fog_start = 1`),
          ),
          field(
            "fog_end",
            "number",
            "The distance where fog reaches full strength.",
            [],
            d(`fog_end = 45000`),
          ),
        ];
      }
    </script>

    <script>
      document.write(`<script src="assets/table_documentation.js?v=${Date.now()}"><\/script>`);
    </script>

    <script>
      const PAGES = [
        { id: "pack", label: "pack" },
        ...PROFILE_TYPES.map((profile) => ({ id: profile, label: profile })),
      ];

      let current = "pack";

      const searchInput = document.getElementById("search");
      const nav = document.getElementById("nav");
      const title = document.getElementById("title");
      const intro = document.getElementById("intro");
      const tags = document.getElementById("tags");
      const content = document.getElementById("content");

      function supports(profiles, page) {
        if (page === "pack") {
          return Array.isArray(profiles) && profiles.includes(page);
        }

        if (profiles === "all") {
          return PROFILE_TYPES.includes(page);
        }

        return Array.isArray(profiles) && profiles.includes(page);
      }

      function lower(value) {
        return String(value || "").toLowerCase();
      }

      function searchable(value) {
        return lower(JSON.stringify(value));
      }

      function matches(value, query) {
        return !query || searchable(value).includes(query);
      }

      function escapeHtml(value) {
        return String(value).replace(
          /[&<>]/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
            })[char],
        );
      }

      function aliasesHtml(aliases) {
        if (!aliases || !aliases.length) {
          return "";
        }

        return html([
          `<p class="alias">Alternative aliases: ${aliases.map((alias) => `<code>${escapeHtml(alias)}</code>`).join(" ")}</p>`,
        ]);
      }

      function pageIntro(page) {
        return (
          PROFILE_INTROS[page] ||
          `Supported fields for the ${page} profile type.`
        );
      }

      function filterFields(fields, page, query, parentMatches = false) {
        return fields
          .filter((item) => supports(item.profiles, page))
          .map((item) => {
            const itemMatches = matches(item, query);
            const childFields = filterFields(
              item.fields || [],
              page,
              query,
              parentMatches || itemMatches,
            );

            if (!query || parentMatches || itemMatches || childFields.length) {
              return {
                ...item,
                fields:
                  query && !itemMatches && !parentMatches
                    ? childFields
                    : item.fields,
              };
            }

            return null;
          })
          .filter(Boolean);
      }

      function pageGroups(page, query = "") {
        return GROUPS.filter((group) => supports(group.profiles, page))
          .map((group) => {
            const groupMatch = matches(
              {
                id: group.id,
                name: group.name,
                desc: group.desc,
                aliases: group.aliases,
                ex: group.ex,
              },
              query,
            );

            const fields = filterFields(group.fields, page, query, groupMatch);

            return fields.length ? { ...group, fields } : null;
          })
          .filter(Boolean);
      }

      function pageHasMatch(page, query) {
        return (
          lower(page.label).includes(query) || pageGroups(page.id, query).length
        );
      }

      function searchResults(query) {
        return PAGES.map((page) => {
          const labelMatch = lower(page.label).includes(query);
          const groups = pageGroups(page.id, labelMatch ? "" : query);

          return groups.length ? { page, groups } : null;
        }).filter(Boolean);
      }

      function renderNav() {
        const query = lower(searchInput.value.trim());

        nav.innerHTML = "";

        PAGES.filter((page) => !query || pageHasMatch(page, query)).forEach(
          (page) => {
            const button = document.createElement("button");
            button.textContent = page.label;
            button.className = page.id === current ? "active" : "";
            button.onclick = () => {
              current = page.id;
              render();
            };
            nav.appendChild(button);
          },
        );
      }

      function renderSearch(query) {
        const results = searchResults(query);

        title.textContent = `Search: ${searchInput.value.trim()}`;
        intro.textContent =
          "Matching fields are grouped by profile type. Alias searches still lead back to the preferred field name.";
        tags.innerHTML = results
          .map(
            (result) =>
              `<span class="tag">${escapeHtml(result.page.label)}</span>`,
          )
          .join("");
        content.innerHTML = results.length
          ? results.map(searchPageHtml).join("")
          : `<div class="empty">No fields matched the search.</div>`;

        renderNav();
      }

      function render() {
        const query = lower(searchInput.value.trim());

        if (query) {
          renderSearch(query);
          return;
        }

        const groups = pageGroups(current);

        title.textContent = current;
        intro.textContent = pageIntro(current);
        tags.innerHTML = groups
          .map((group) => `<span class="tag">${escapeHtml(group.name)}</span>`)
          .join("");
        content.innerHTML = groups.length
          ? groups.map(groupHtml).join("")
          : `<div class="empty">No fields matched the search.</div>`;

        renderNav();
      }

      function searchPageHtml(result) {
        return html([
          `<details class="profile-result">`,
          `  <summary>`,
          `    <span class="name">${escapeHtml(result.page.label)}</span>`,
          `    <span class="type">${result.groups.length} groups</span>`,
          `  </summary>`,
          ``,
          `  <div class="body">`,
          `    <div class="children">`,
          `      ${result.groups.map(groupHtml).join("")}`,
          `    </div>`,
          `  </div>`,
          `</details>`,
        ]);
      }

      function groupHtml(group) {
        return html([
          `<details class="group">`,
          `  <summary>`,
          `    <span class="name">${escapeHtml(group.name)}</span>`,
          `    <span class="type">${group.fields.length} fields</span>`,
          `  </summary>`,
          ``,
          `  <div class="body">`,
          `    <p class="desc">${escapeHtml(group.desc)}</p>`,
          `    ${aliasesHtml(group.aliases)}`,
          ``,
          `    <pre class="example"><code>${escapeHtml(group.ex)}</code></pre>`,
          ``,
          `    <div class="children">`,
          `      ${group.fields.map(fieldHtml).join("")}`,
          `    </div>`,
          `  </div>`,
          `</details>`,
        ]);
      }

      function fieldHtml(item) {
        const childHtml =
          item.fields && item.fields.length
            ? `<div class="children">${item.fields.map(fieldHtml).join("")}</div>`
            : "";

        return html([
          `<details class="field">`,
          `  <summary>`,
          `    <span class="name"><code>${escapeHtml(item.name)}</code></span>`,
          `    <span class="type">${escapeHtml(item.type)}</span>`,
          `  </summary>`,
          ``,
          `  <div class="body">`,
          `    <p class="desc">${escapeHtml(item.desc)}</p>`,
          `    ${aliasesHtml(item.aliases)}`,
          ``,
          `    <pre class="example"><code>${escapeHtml(item.ex)}</code></pre>`,
          ``,
          `    ${childHtml}`,
          `  </div>`,
          `</details>`,
        ]);
      }

      searchInput.addEventListener("input", render);
      render();
    </script>
  </body>
</html>
